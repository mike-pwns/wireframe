<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Renderer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ============================================ -->
        <!-- INFO COLUMN (~2/3 width)                      -->
        <!-- ============================================ -->

        <section class="info">

            <header class="brand">
                <h1 class="brand__title">WIREFRAME</h1>
                <p class="brand__byline">a project made for fun and games.</p>
                <a class="brand__link" href="#" target="_blank" rel="noopener noreferrer">
                    &gt; check out the math and more info here
                </a>
            </header>

            <div class="rule"></div>

            <nav class="gallery" aria-label="Model selector">

                <p class="gallery__label">// select a model</p>

                <div class="gallery__grid" id="gallery">

                    <button class="gallery__item gallery__item--big is-active" data-model-id="0" data-model-name="CUBE">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="12,16 32,16 32,36 12,36" />
                            <polygon points="18,8 38,8 38,28 18,28" />
                            <line x1="12" y1="16" x2="18" y2="8" />
                            <line x1="32" y1="16" x2="38" y2="8" />
                            <line x1="32" y1="36" x2="38" y2="28" />
                            <line x1="12" y1="36" x2="18" y2="28" />
                        </svg>
                        <span class="gallery__caption">CUBE</span>
                    </button>

                    <button class="gallery__item" data-model-id="1" data-model-name="PYRAMID">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="24,8 10,36 38,36" />
                            <line x1="16" y1="30" x2="32" y2="30" />
                            <line x1="10" y1="36" x2="16" y2="30" />
                            <line x1="38" y1="36" x2="32" y2="30" />
                        </svg>
                        <span class="gallery__caption">PYRAMID</span>
                    </button>

                    <button class="gallery__item" data-model-id="2" data-model-name="SPHERE">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="24" cy="24" r="15" />
                            <ellipse cx="24" cy="24" rx="15" ry="5" />
                            <ellipse cx="24" cy="24" rx="5" ry="15" />
                        </svg>
                        <span class="gallery__caption">SPHERE</span>
                    </button>

                    <button class="gallery__item" data-model-id="3" data-model-name="OCTAHEDRON">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="24,6 42,24 24,42 6,24" />
                            <line x1="6" y1="24" x2="42" y2="24" />
                            <line x1="24" y1="6" x2="24" y2="42" />
                        </svg>
                        <span class="gallery__caption">OCTA</span>
                    </button>

                    <button class="gallery__item" data-model-id="4" data-model-name="TORUS">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <ellipse cx="24" cy="24" rx="18" ry="9" />
                            <ellipse cx="24" cy="24" rx="7" ry="3" />
                        </svg>
                        <span class="gallery__caption">TORUS</span>
                    </button>

                    <button class="gallery__item" data-model-id="5" data-model-name="SYNTHSCAPE">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="24" cy="14" r="7" />
                            <line x1="17" y1="14" x2="31" y2="14" />
                            <line x1="18.3" y1="17.5" x2="29.7" y2="17.5" />
                            <line x1="24" y1="22" x2="24" y2="40" />
                            <line x1="4" y1="40" x2="24" y2="22" />
                            <line x1="44" y1="40" x2="24" y2="22" />
                            <line x1="4" y1="40" x2="44" y2="40" />
                        </svg>
                        <span class="gallery__caption">SYNTH</span>
                    </button>

                    <button class="gallery__item" data-model-id="6" data-model-name="PENGUIN">
                        <svg class="gallery__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <ellipse cx="24" cy="30" rx="12" ry="14" />
                            <circle cx="24" cy="12" r="8" />
                            <polygon points="20,12 28,12 24,18" />
                        </svg>
                        <span class="gallery__caption">PENGUIN</span>
                    </button>

                </div>

            </nav>

        </section>

        <!-- ============================================ -->
        <!-- SIMULATION COLUMN (~1/3 width)                -->
        <!-- top half: viewport. bottom half: controls     -->
        <!-- ============================================ -->

        <section class="simulation">

            <div class="viewport__frame" id="viewportFrame">

                <canvas id="canvas" width="1024" height="1024"></canvas>

                <div class="viewport__bar">
                    <button id="fullscreenToggle" class="viewport__btn">[ fullscreen ]</button>
                    <div class="viewport__zoom">
                        <span class="viewport__zoom-label">zoom <span id="zoomValue">1.00</span></span>
                        <button id="zoomOut" class="viewport__btn viewport__btn--icon" aria-label="Zoom out">-</button>
                        <button id="zoomIn" class="viewport__btn viewport__btn--icon" aria-label="Zoom in">+</button>
                    </div>
                </div>

            </div>

            <div class="controls">

                <div class="controls__hint">
                    <span class="controls__hint-label">// movement</span>
                    <span class="controls__hint-keys">
                        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly
                        <br>
                        <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> look
                        <br>
                        <kbd>SPACE</kbd> / <kbd>SHIFT</kbd> up / down
                    </span>
                </div>

                <div class="controls__slider">
                    <label for="rotHorizontal">horizontal_rotation_speed = <span id="rotHorizontalValue">0.00</span>
                        rad/s</label>
                    <input type="range" id="rotHorizontal" min="0" max="5" step="0.01" value="0">
                </div>

                <div class="controls__slider">
                    <label for="rotVertical">vertical_rotation_speed = <span id="rotVerticalValue">0.00</span>
                        rad/s</label>
                    <input type="range" id="rotVertical" min="0" max="5" step="0.01" value="0">
                </div>

            </div>

        </section>

    </div>

    <!-- fullscreen overlay target - populated by JS, empty until toggled -->
    <div class="fullscreen-overlay" id="fullscreenOverlay"></div>

    <script src="renderer.js"></script>
    <script src="renderer_interface.js"></script>

</body>

</html>
